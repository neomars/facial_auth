# /etc/facial-auth/facial-auth.conf - local settings for facial-authd.
#
# Every option and its default is documented in
# /usr/share/facial-auth/defaults.conf.  Uncomment and change what you need,
# then: sudo systemctl reload facial-authd
#
# Settings changed from the "Face Login" app are stored separately in
# /var/lib/facial-auth/settings.conf and override this file.

#[recognition]
#threshold = 0.55

# Allow the lock screen with a plain colour webcam (a photograph shown on a phone could then fool it,
# even with the head-turn test: see docs/SECURITY.md before you do):
#[services]
#cinnamon-screensaver = any

# Experimental: keep the password prompt visible at the GNOME login screen
# while the camera scans (validated on terminals, not on GDM):
#[interaction]
#gdm-password = parallel
