# facial-auth defaults (documentation of the built-in values).
# Do not edit: put your changes in /etc/facial-auth/facial-auth.conf
# (or /etc/facial-auth/facial-auth.conf.d/*.conf).

# General
[core]
# master switch (the password login is never affected)
enabled = true
# seconds without activity before the daemon exits (socket/D-Bus activation restarts it)
idle_timeout = 900.0
# debug | info | warning | error
log_level = info

# Camera selection (see: facial-auth cameras)
[camera]
# auto, or /dev/videoN, or /dev/v4l/by-id/...
device = auto
# ir-first | rgb-first | ir-only | rgb-only
preference = ir-first
# force the class of the selected device: auto | ir | rgb
class = auto
width = 640
height = 480
warmup_frames = 3
# mean pixel value under which a frame is ignored
dark_threshold = 6.0
# command run before an infrared capture (e.g. an IR emitter helper); root-only setting
emitter_command = 
# command run after an infrared capture
emitter_stop_command = 
# accept v4l2loopback / test-pattern devices (never do this in production)
allow_virtual = false
# trust an "infrared" camera only after `facial-auth check-camera` has shown that it does not
# see a phone screen (a monochrome sensor without infrared filter does, and a photo on a phone
# then unlocks the session)
require_ir_check = true

# Matching (SFace cosine similarity)
[recognition]
# cosine similarity needed; higher = stricter (floor: 0.30)
threshold = 0.45
# consecutive matching frames needed
required_matches = 3
# the face must beat every other enrolled account by this margin
impostor_margin = 0.05
# scan window (seconds) when the password prompt stays available
timeout = 8.0
# scan window (seconds) when the scan comes first (login screen)
sequential_timeout = 4.0
# sequential mode: give up early when nobody is in front of the camera
no_face_timeout = 2.0
# smallest face (pixels) accepted: too far = no match
min_face_px = 90
# CPU limiter
max_fps = 15.0
# do not power the camera for answers that arrive within this delay (sudo -S)
parallel_start_delay = 0.15

# Presentation-attack detection
[liveness]
# off | basic | challenge
#   basic      rejects a feed repeating identical frames; NOT a defence against a photo or a screen
#   challenge  basic + "turn your head": the face must show depth (see docs/SECURITY.md)
mode = challenge
# seconds for the whole head turn, counted from the moment the instruction is sent: it includes the time
# to read it and the final "look at the screen" check
challenge_timeout = 12.0
# parallax of the nose (fraction of the distance between the eyes) that counts as a turn.
# A hand-held flat picture gives about 0.005 (never twice in a row above 0.02 in 240 simulated attempts);
# a head turned by 10 degrees gives about 0.02, by 15 degrees about 0.03: turn *clearly*.
# `facial-auth test --liveness` prints the values measured on your camera and says what to change.
challenge_turn = 0.02
# consecutive frames beyond challenge_turn
challenge_hold = 3
# the camera image is already mirrored (rare)
mirror = false

# Lock-out and context checks
[security]
# wrong faces (face seen, not matching) before the face path is locked...
max_failures = 5
# ...within this many seconds
failure_window = 60.0
# how long the face path stays locked (the password is never locked by this)
lockout = 60.0
# every lock-out that follows another lasts this many times longer...
lockout_growth = 2.0
# ...up to this many seconds
lockout_max = 3600.0
# allow the root account to use its face
allow_root = false
# closed lid: the built-in camera sees nothing
abort_if_lid_closed = true
# never use the local camera for ssh/remote sessions
abort_if_remote = true

# Where the face may be used, and which camera it needs: any | ir | off.
# Every service needs an infrared camera by default: a colour webcam is fooled by a photograph
# shown on a phone.  "any" is an informed opt-in.  Services that are not listed never use the face.
[services]
gdm-password = ir
lightdm = ir
sddm = ir
login = ir
xscreensaver = ir
cinnamon-screensaver = ir
mate-screensaver = ir
sudo = ir
sudo-i = ir
su = ir
su-l = ir
polkit-1 = ir

# How the password prompt behaves while the camera scans:
#   sequential   scan first, then the password prompt (safe everywhere)
#   parallel     the prompt is shown during the scan (graphical helpers)
#   parallel-tty same, for terminals (sudo, su, login)
[interaction]
default = sequential
sudo = parallel-tty
sudo-i = parallel-tty
su = parallel-tty
su-l = parallel-tty
login = parallel-tty
polkit-1 = parallel
