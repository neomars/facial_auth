<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the daemon's user may own the name. -->
  <policy user="facial-auth">
    <allow own="io.github.neomars.FacialAuth1"/>
  </policy>

  <!-- Anyone may call the API: every method is authorised by the daemon
       itself (own account) or by polkit (administrator actions). -->
  <policy context="default">
    <allow send_destination="io.github.neomars.FacialAuth1"/>
    <allow receive_sender="io.github.neomars.FacialAuth1"/>
  </policy>
</busconfig>
